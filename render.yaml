services:
  - type: web
    name: beauty-shopping
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beauty-shopping-db
          property: connectionString

databases:
  - name: beauty-shopping-db
    plan: free
    databaseName: beauty_shopping
    user: beauty_shopping
